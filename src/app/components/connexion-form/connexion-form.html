<section>
            <form action="" method="" id="connected-form">
                <h2>Se connecter</h2>
                <p>Nouveau sur ce site? <a href="signUp.html">S'inscrire</a></p>
        
                <fieldset class="sign-in-fielset">
                    <legend>Informations personnelles</legend>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="pwd">Mot de passe: </label>
                        <input type="password" name="password" id="pwd" placeholder="Votre mot de passe" required>
                    </div>
                </fieldset>
        
                <!-- voir plus tard lien pour récupérer le mot de pass oublié  -->
                <p>Mot de passe oublié?</p>
        
                <button type="submit" class="btn-signUp">Se connecter</button>
        
            </form>
        </section>
